services:
  - type: web
    name: napstertec-voice-gateway
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: VOICE_GATEWAY_API_KEY
        sync: false

      - key: PIPER_VOICE_NAME
        value: en_US-lessac-low
      - key: PIPER_VOICE_PATH
        value: /opt/piper/voices/en_US-lessac-low.onnx
      - key: PIPER_SAMPLE_RATE
        value: "16000"
      - key: MAX_TTS_CHARS
        value: "2000"
      - key: HTTP_TIMEOUT_SECONDS
        value: "15"

      - key: ARKESEL_API_KEY
        sync: false
      - key: ARKESEL_VOICE_SMS_URL
        value: https://sms.arkesel.com/api/v2/sms/voice/send
      - key: ARKESEL_VOICE_ID
        value: en-GH-female
      - key: ARKESEL_SENDER_ID
        value: NapsterTec

      - key: ARKESEL_VOICECONNECT_ENABLED
        value: "false"
      - key: ARKESEL_VOICECONNECT_BASE_URL
        value: ""
      - key: ARKESEL_VOICECONNECT_TOKEN
        sync: false

      - key: NIE_COMMUNICATION_WEBHOOK_URL
        sync: false
      - key: NIE_SERVICE_TOKEN
        sync: false
